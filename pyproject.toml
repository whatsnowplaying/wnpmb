[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wnpmb"
dynamic = ["version"]
description = "Shared MusicBrainz client, normalization, and artist resolution"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "normality",
    "truststore",
    # normality requires PyICU; see requirements.txt for install notes
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "setuptools-scm>=8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Writes _version.py into the package on build; importable as wnpmb.__version__
write_to = "src/wnpmb/_version.py"

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/fetch_fixtures.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
